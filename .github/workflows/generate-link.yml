name: Generate Shopee Affiliate Link

on:
  workflow_dispatch:
    inputs:
      original_link:
        description: "Shopee original link"
        required: true
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt

      - name: Generate link
        env:
          ORIGINAL_LINK: ${{ inputs.original_link }}
        run: python3 main.py
